<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>IRON · 对局观察席</title>
<style>
:root{color-scheme:light;--paper:#f2f1eb;--ink:#24372f;--muted:#758079;--line:#dce1d8;--accent:#277b5e;--card:#fff;--red:#bd6151}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.65 "Segoe UI","Microsoft YaHei",sans-serif}button,select,input,textarea{font:inherit}button,select{cursor:pointer}button{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 13px;color:var(--ink)}button:hover{border-color:var(--accent)}button.active{background:var(--accent);color:white;border-color:var(--accent)}header{background:#213d32;color:#f2f4ec;padding:22px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:23px;letter-spacing:2px;margin:0}header small{color:#afc8b6}header button{background:#ffffff12;color:white;border-color:#ffffff40}.live{display:inline-block;width:8px;height:8px;background:#74d4a7;border-radius:50%;margin-right:8px}.wrap{max-width:1560px;margin:auto;padding:22px 30px}#alert{display:none;background:#ffe4dd;color:#843d30;border-radius:8px;padding:12px;margin-bottom:15px}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}.metric{padding:15px 20px}.metric span{display:block;color:var(--muted);font-size:12px}.metric strong{font-size:22px;font-weight:600}.bar{height:5px;background:#e8ece5;margin-top:9px;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr);gap:18px;margin-top:18px}.panel{padding:20px;min-width:0}h2{font-size:16px;margin:0 0 14px}h3{font-size:14px;margin:12px 0 6px}.muted{color:var(--muted);font-size:12px}.preview{width:100%;aspect-ratio:16/9;object-fit:contain;background:#12261e;border-radius:8px}.phase{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.chip{padding:5px 9px;border-radius:6px;background:#f0f3ed;color:#647266;font-size:12px}.chip.done{color:#237153;background:#e3f4e9}.countries{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:18px}.country{border:1px solid var(--line);padding:12px;border-radius:9px;background:#fff}.country b{display:block}.country small{font-size:11px;color:var(--muted)}.delta{font-size:21px;margin-top:5px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:20px 0 12px}.controls{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}select{border:1px solid var(--line);border-radius:7px;padding:7px;background:white;color:var(--ink)}.scroll{max-height:570px;overflow:auto}.entry{padding:12px 0;border-bottom:1px solid #edf0e9}.entry:last-child{border:0}.entry .label{font-size:11px;color:var(--muted);margin-bottom:4px}.entry p{white-space:pre-wrap;margin:4px 0;overflow-wrap:anywhere}.tag{font-size:11px;color:#28654c;padding:2px 6px;border-radius:4px;background:#e9f3eb;margin-right:7px}pre{background:#f3f5ef;border-radius:7px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,"Microsoft YaHei",monospace}.secret{border-left:3px solid #c89756;padding-left:12px}.noteform textarea{width:100%;min-height:92px;border:1px solid var(--line);border-radius:8px;padding:10px;resize:vertical;background:#fcfdf9}.noteform .controls{margin:9px 0}.noteform input{width:70px;border:1px solid var(--line);border-radius:6px;padding:6px}.primary{background:var(--accent);color:white}.empty{padding:28px 12px;color:var(--muted);text-align:center}.footer{padding:20px 0;color:var(--muted);font-size:11px}a{color:#277b5e}#notice{color:#ba7228;font-size:12px;margin-left:10px}.summary{background:#f2f6ee;border-radius:8px;padding:13px;margin-bottom:13px}#connection{font-size:12px}.busy .live{background:#f4bd63}@media(max-width:1000px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(3,1fr)}.countries{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.wrap{padding:12px}header{padding:16px}.metrics{grid-template-columns:repeat(2,1fr)}.countries{grid-template-columns:repeat(2,1fr)}}
.previewFrame{position:relative;aspect-ratio:16/9;background:#12261e;border-radius:8px;overflow:hidden}.previewFrame .preview{position:absolute;inset:0;display:none}.previewWaiting{position:absolute;inset:0;display:grid;place-items:center;color:#c3d3c5;font-size:13px}</style>
<header><div><small>HOI BATTLE OF AGENTS / OBSERVATION ROOM</small><h1>IRON · 对局观察席</h1></div><div><span id="connection"><i class="live"></i>连接中</span>　<button id="export">导出观察战报 ↓</button></div></header>
<main class="wrap"><div id="alert"></div><div class="metrics" id="metrics"></div>
<div class="layout"><section><div class="panel"><div class="controls"><h2 style="margin:0">战场实时画面</h2><span class="muted" id="recording">等待录制准备</span></div><div class="previewFrame"><div class="previewWaiting" id="previewWaiting">等待 OBS 游戏画面 · 准备完成后自动显示</div><img class="preview" id="preview" alt="HOI4原生游戏捕获"></div><div class="phase" id="phases"></div><div class="muted" style="margin-top:9px" id="phaseCaption"></div></div><div class="countries" id="countries"></div></section>
<aside class="panel"><h2>事态发展</h2><div class="summary" id="summary">等待首轮观察数据。</div><div class="scroll" id="events" style="max-height:390px"></div></aside></div>
<div class="layout"><section class="panel"><div class="controls"><h2 style="margin:0">回合记录</h2><label>查看回合 <select id="turn"><option value="all">全部回合</option></select></label></div><div class="tabs" id="tabs"><button data-tab="public" class="active">公开互动</button><button data-tab="host">公开主持</button><button data-tab="referee">裁判与执行</button><button data-tab="audience">观众密档</button><button data-tab="director">赛后导演</button></div><div class="controls"><label><input type="checkbox" id="audience"> 开启观众密档（含私信与秘密命令）<span id="notice"></span></label></div><div class="scroll" id="records"></div></section>
<aside class="panel"><h2>我的观察与标记</h2><p class="muted">随手记录疑点、名场面和后续追踪事项。笔记只给你看，不发送给参赛者。</p><form class="noteform" id="notesForm"><textarea id="note" placeholder="例如：克莱德公开支持奥地利，但需要继续观察其后续行动。" required maxlength="2000"></textarea><div class="controls"><label>回合 <input id="noteTurn" type="number" min="0" max="100" value="1"></label><select id="noteLabel"><option>观察</option><option>名场面</option><option>疑点</option><option>待追踪</option></select><button class="primary">保存笔记</button></div><div id="noteStatus" class="muted"></div></form><div class="scroll" id="notes" style="max-height:310px"></div></aside></div>
<div class="footer" id="footer">本地只读观察面板 · 不向玩家提供全知视角 · 采访与导演点评赛后补齐 · 语音在后续服务器生成</div></main>
<script>
let state=null,tab='public',selected='all',locked=false;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pretty=v=>esc(JSON.stringify(v,null,2)),empty=s=>`<div class="empty">${esc(s)}</div>`;const labels={preparing:'准备中',starting:'正在初始化',deciding:'五国讨论与决策',approved:'裁判已批准',executing:'正在执行游戏命令',completed:'已完成',ready_for_next_turn:'准备下一回合',needs_inspection:'已暂停，需检查',prepared:'已准备',interrupted:'执行中断'};const types={war_started:'宣战 / 战争开始',war_ended:'战争结束',province_control_changed:'省份控制权变化'};const cname=t=>{let c=state?.countries.find(x=>x.tag===t);return c?`${c.name} · ${c.country}`:t||'主持人'};const entry=(title,text,kind='')=>`<div class="entry ${kind}"><div class="label">${esc(title)}</div><p>${esc(text)}</p></div>`;
function eventText(e){const f=e.facts;if(e.kind==='province_control_changed')return `省份 ${f.province_id}：${f.before_controller} → ${f.after_controller}`;if(['war_started','war_ended'].includes(e.kind))return (f.countries||[]).map(cname).join(' ↔ ');return JSON.stringify(f)}
function render(){let s=state;const avg=s.average_seconds,remaining=avg?Math.ceil((s.limit-s.completed)*avg/60):null;$('#metrics').innerHTML=[['回合进度',`${s.completed} / ${s.limit}`,`<div class="bar"><i style="width:${Math.min(100,s.completed/s.limit*100)}%"></i></div>`],['游戏日期',s.date||'待采集',''],['当前阶段',labels[s.turns.at(-1)?.status]||labels[s.status]||s.status,''],['近5回合平均',avg?`${Math.round(avg)} 秒`:'等待完整回合',''],['预计剩余采集',remaining===null?'待估算':`约 ${remaining} 分钟`,'']].map(([a,b,c])=>`<div class="metric"><span>${esc(a)}</span><strong>${esc(b)}</strong>${c}</div>`).join('');const alert=s.error;$('#alert').style.display=alert?'block':'none';$('#alert').textContent=alert||'';$('#phases').innerHTML=Object.entries(s.phases).map(([k,v])=>`<span class="chip ${v?'done':''}">${esc(k)} ${v}/${k==='裁判'?1:s.countries.length||5}</span>`).join('');$('#phaseCaption').textContent=`第 ${s.current} 回合 · 数字表示已落盘响应；“回信”只统计实际需要回复的国家。`;$('#countries').innerHTML=s.countries.map(c=>{let r=(s.scoreboard.rows||[]).find(x=>x.country===c.tag)||{};return `<div class="country"><small>${esc(c.tag)} / ${esc(c.country)}</small><b>${esc(c.name)}</b><div class="delta">${r.controlled_land??'—'} <small>省</small></div><small>较开局 ${r.land_delta>=0?'+':''}${r.land_delta??'—'}</small><div class="muted" title="${esc(c.model)}">${esc(c.model||'待配置')}</div></div>`}).join('');let last=s.events.at(-1),totalActions=s.turns.reduce((n,r)=>n+Object.values(r.action_counts).reduce((a,b)=>a+b,0),0);$('#summary').textContent=`已完成 ${s.completed} 回合，记录 ${s.events.length} 条公开局势变化、${totalActions} 条已提交动作。`+(last?` 最近变化：第${last.turn}回合，${eventText(last)}。`:' 尚未记录到公开领土或战争关系变化。');$('#events').innerHTML=s.events.slice().reverse().map(e=>entry(`回合 ${e.turn} · ${types[e.kind]||e.kind}`,eventText(e))).join('')||empty('公开局势变化会出现在这里');const old=$('#turn').value;$('#turn').innerHTML='<option value="all">全部回合</option>'+s.turns.slice().reverse().map(r=>`<option value="${r.index}">第 ${r.index} 回合${r.date?' · '+esc(r.date):''}</option>`).join('');$('#turn').value=old;if($('#turn').value==='')$('#turn').value='all';$('#notes').innerHTML=s.notes.slice().reverse().map(n=>entry(`第${n.turn}回合 · ${n.label}`,n.text)).join('')||empty('还没有笔记');if(document.activeElement!==$('#noteTurn'))$('#noteTurn').value=s.current;const rec=s.recording;$('#recording').textContent=rec.active?`● 录制中 · ${rec.output_path||rec.recording_directory||''}`:rec.status||'等待OBS录制';$('#footer').textContent=`${s.name} · 本地观察专用 · 采访/导演：${s.audience_timing==='postmatch'?'赛后补生成':'随回合生成'} · 更新 ${new Date(s.updated_at).toLocaleTimeString()}`;renderRecords()}
function renderRecords(){if(!state)return;let rows=state.turns.filter(r=>selected==='all'||String(r.index)===selected).slice().reverse(),out=[];if(['audience','referee','director'].includes(tab)&&!$('#audience').checked){$('#records').innerHTML=empty('此栏目含观众专属信息。勾选“开启观众密档”后查看；这些内容不会发送给参赛者。');return}for(const r of rows){if(tab==='public')for(const p of r.public)out.push(entry(`第${r.index}回合 · 公开轮${p.round||1} · ${cname(p.country)}`,p.message));if(tab==='host')for(const p of r.host)out.push(entry(`第${r.index}回合 · 公开主持`,p.message));if(tab==='referee'){out.push(`<div class="entry"><div class="label">第${r.index}回合 · 裁判：${esc(r.referee_status)} · 游戏推进 ${r.game_hours??'—'} 小时 · 原生执行 ${r.native_seconds??'—'} 秒</div><pre>${pretty(r.referee||{})}</pre><pre>${pretty(r.actions||[])}</pre></div>`)}if(tab==='audience'){for(const [tag,i]of Object.entries(r.intent||{}))if(Object.keys(i).length)out.push(entry(`第${r.index}回合 · ${cname(tag)} · 事前意图摘要（非隐藏思维链）`,[i.goal,i.plan,i.concealment].filter(Boolean).join('\n'),'secret'));for(const p of r.private||[])out.push(entry(`第${r.index}回合 · 私信 ${cname(p.country)} → ${cname(p.to)}`,p.message,'secret'));for(const [tag,d]of Object.entries(r.decisions||{}))if(Object.keys(d).length)out.push(`<div class="entry secret"><div class="label">第${r.index}回合 · ${esc(cname(tag))} · 密封决策</div><p>${esc(d.reason)}</p><pre>${pretty(d.actions)}</pre></div>`)}if(tab==='director'){for(const i of r.interviews||[])out.push(entry(`第${r.index}回合 · 私密采访 · ${cname(i.country)}`,i.answer,'secret'));if(r.commentary)out.push(`<div class="entry"><div class="label">第${r.index}回合 · 观众导演点评</div><pre>${pretty(r.commentary)}</pre></div>`)}}$('#records').innerHTML=out.join('')||empty(tab==='director'?'采访与导演点评将在赛后补齐':'当前还没有此类记录')}
async function refresh(){if(locked)return;locked=true;try{let res=await fetch('/api/state?view='+($('#audience').checked?'audience':'public'));if(!res.ok)throw Error(res.status);state=await res.json();render();$('#connection').innerHTML='<i class="live"></i>实时更新 · 每3秒';}catch(e){$('#connection').textContent='连接中断，自动重连';}finally{locked=false}}
$('#turn').onchange=e=>{selected=e.target.value;renderRecords()};$('#audience').onchange=()=>{$('#notice').textContent=$('#audience').checked?'观众视角已开启':'';refresh()};$('#tabs').onclick=e=>{if(!e.target.dataset.tab)return;tab=e.target.dataset.tab;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderRecords()};$('#notesForm').onsubmit=async e=>{e.preventDefault();let res=await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({turn:Number($('#noteTurn').value),label:$('#noteLabel').value,text:$('#note').value})});if(res.ok){$('#note').value='';$('#noteStatus').textContent='已保存，仅留在观察席';refresh()}else $('#noteStatus').textContent='保存失败，请重试'};$('#export').onclick=async()=>{let text=await(await fetch('/api/summary')).text(),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));a.download=(state?.name||'IRON')+'-观察战报.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#preview').onerror=()=>{$('#preview').style.display='none';$('#previewWaiting').style.display='grid';};$('#preview').onload=()=>{$('#preview').style.display='block';$('#previewWaiting').style.display='none';};setInterval(()=>{$('#preview').src='/preview.png?t='+Date.now()},10000);refresh();$('#preview').src='/preview.png';setInterval(refresh,3000);
</script></html>
